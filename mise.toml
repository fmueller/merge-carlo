# Pinned developer and CI toolchain.
#
# `mise run setup` is the single entry point for a working checkout: it installs
# the pinned tools, syncs the locked Python environment, and installs the local
# git hooks. The hooks are opt-in, so a fresh clone has none until setup runs.

[tools]
lefthook = "2.1.10"
uv = "0.9.17"

[tasks.setup]
description = "Install the toolchain, sync dependencies, and install git hooks"
run = [
  "mise install",
  "uv sync --locked --dev",
  "lefthook install",
]

# Mutation testing runs the suite once per mutant, so the per-change loop is
# scoped to the modules a diff touched and the full gate runs weekly in CI.
[tasks."test:mutate"]
description = "Run mutation tests for source modules changed since BASE (default main)"
run = "bash scripts/mutate-diff.sh"

[tasks."test:mutate:gate"]
description = "Run the full mutation gate and enforce the per-module efficacy floor"
run = [
  "uv run mutmut run",
  "uv run mutmut results --all true | bash scripts/check-mutation-floor.sh",
]

[tasks."test:mutation-floor"]
description = "Test the per-module mutation efficacy guard"
run = "bash scripts/check-mutation-floor-test.sh"

[tasks.check]
description = "Run the full local gate mirroring the CI checks"
run = [
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run mypy",
  "uv run pytest -v",
  "bash scripts/check-commit-msg-test.sh",
  "bash scripts/check-push-messages-test.sh",
  "bash scripts/check-author-test.sh",
  "bash scripts/check-mutation-floor-test.sh",
]
