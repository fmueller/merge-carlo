[project]
name = "merge-carlo"
version = "0.1.0"
description = "Offline scenario explorer for human and AI pull-request review workflows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Felix Müller", email = "felix@fmueller.io" }]
keywords = [
    "cli",
    "code-review",
    "discrete-event-simulation",
    "github",
    "monte-carlo",
    "pull-requests",
    "simulation",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "simpy>=4.1.2",
    "typer>=0.27.2",
]

[project.scripts]
merge-carlo = "merge_carlo.cli:app"

[project.urls]
Homepage = "https://github.com/fmueller/merge-carlo"
Repository = "https://github.com/fmueller/merge-carlo"
Issues = "https://github.com/fmueller/merge-carlo/issues"
Changelog = "https://github.com/fmueller/merge-carlo/blob/main/CHANGELOG.md"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "build>=1.3.0",
    "hypothesis>=6.168.0",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.14.4",
    "twine>=6.2.0",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 120
# planning/ and specs/ are managed by the taskrail CLI; a formatter must not
# rewrite generated state or a normative spec.
extend-exclude = ["planning", "specs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
# Ruff also formats code blocks inside Markdown. This project's prose is
# hand-wrapped, so formatting is limited to Python sources.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = "src/**/*.py,tests/**/*.py"
strict = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "property: Property-based tests",
]

[build-system]
requires = ["setuptools>=77", "packaging>=24.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
