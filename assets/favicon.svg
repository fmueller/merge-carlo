<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">merge-carlo</title>
  <!--
    Light is the default, carried by presentation attributes so renderers that
    do not implement CSS still draw the mark correctly. The dark palette is
    applied by class, which outranks a presentation attribute in the cascade.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .body { stroke: #F1EEF9; }
      .link { stroke: #F1EEF9; }
      .pip  { fill: #F1EEF9; }
      .node { fill: #9E8BFF; }
    }
  </style>
  <rect class="body" x="7" y="7" width="50" height="50" rx="14" fill="none" stroke="#14161C" stroke-width="4.6"/>
  <path class="link" d="M22 22 C30 22 33 32 41 32" fill="none" stroke="#14161C" stroke-width="3.4" stroke-linecap="round" opacity=".5"/>
  <path class="link" d="M22 42 C30 42 33 32 41 32" fill="none" stroke="#14161C" stroke-width="3.4" stroke-linecap="round" opacity=".5"/>
  <circle class="pip" cx="22" cy="22" r="4.3" fill="#14161C"/>
  <circle class="pip" cx="22" cy="42" r="4.3" fill="#14161C"/>
  <circle class="node" cx="41" cy="32" r="5.2" fill="#5B3DEF"/>
</svg>
