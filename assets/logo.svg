<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">merge-carlo</title>
  <!--
    Light is the default, carried by presentation attributes so renderers that
    do not implement CSS still draw the mark correctly. The dark palette is
    applied by class, which outranks a presentation attribute in the cascade.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .branch { stroke: #F1EEF9; }
      .sample { fill: #F1EEF9; }
      .node   { fill: #9E8BFF; }
    }
  </style>
  <path class="branch" d="M6 14 C16 14 18 32 27 32" fill="none" stroke="#14161C" stroke-width="4.2" stroke-linecap="round"/>
  <path class="branch" d="M6 50 C16 50 18 32 27 32" fill="none" stroke="#14161C" stroke-width="4.2" stroke-linecap="round"/>
  <g class="sample" fill="#14161C">
    <circle cx="40" cy="24" r="2.3" opacity=".85"/>
    <circle cx="40" cy="32" r="2.3" opacity=".85"/>
    <circle cx="40" cy="40" r="2.3" opacity=".85"/>
    <circle cx="50" cy="17" r="2.3" opacity=".6"/>
    <circle cx="50" cy="25" r="2.3" opacity=".6"/>
    <circle cx="50" cy="32" r="2.3" opacity=".6"/>
    <circle cx="50" cy="39" r="2.3" opacity=".6"/>
    <circle cx="50" cy="47" r="2.3" opacity=".6"/>
    <circle cx="60" cy="11" r="2.3" opacity=".32"/>
    <circle cx="60" cy="21" r="2.3" opacity=".32"/>
    <circle cx="60" cy="32" r="2.3" opacity=".32"/>
    <circle cx="60" cy="43" r="2.3" opacity=".32"/>
    <circle cx="60" cy="53" r="2.3" opacity=".32"/>
  </g>
  <circle class="node" cx="27" cy="32" r="5.6" fill="#5B3DEF"/>
</svg>
